server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Build filenames include content hashes. New builds get new URLs.
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Bump the version in these filenames whenever the background changes.
    location ~ ^/BackgroundVideo-(compressed|poster)-v[0-9]+\.(mp4|jpg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Portfolio filenames can be reused, so keep their cache lifetime shorter.
    location ~* \.(jpg|jpeg|png|webp|avif|svg|ico|mp4|mp3|woff2?)$ {
        try_files $uri =404;
        expires 1d;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Support direct project links and always check for the latest app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
